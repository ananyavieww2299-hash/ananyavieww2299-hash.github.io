<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Portfolio - Ananya Munjinda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif, system-ui;
        }

        body {
            overflow: hidden;
            background-color: #1a102f;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* UI overlay สำหรับข้อมูลตัวละคร/นักศึกษา */
        #profile-card {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 15px 25px;
            border-radius: 16px;
            border: 4px solid #ff6b8b;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            pointer-events: none;
            max-width: 320px;
        }

        #profile-card h1 {
            font-size: 1.2rem;
            color: #d63384;
            margin-bottom: 4px;
        }

        #profile-card h2 {
            font-size: 0.95rem;
            color: #4a4a4a;
            font-weight: 500;
        }

        #profile-card p {
            font-size: 0.8rem;
            color: #666;
            margin-top: 6px;
        }

        /* Modal Pop-up สำหรับแสดงข้อมูลเมื่อกดปุ่ม */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: white;
            padding: 25px;
            border-radius: 20px;
            border: 5px solid #ff4757;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            max-width: 450px;
            width: 90%;
            transition: all 0.2s ease-out;
            opacity: 0;
        }

        .modal.active {
            display: block;
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #ff758c;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.4rem;
            color: #ff4757;
            font-weight: bold;
        }

        .close-btn {
            background: #ff4757;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .modal-content {
            font-size: 0.95rem;
            color: #333;
            line-height: 1.6;
        }

        /* คำแนะนำมุมซ้ายล่าง */
        #instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
    <!-- Import Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Import Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UI ส่วนแนะนำตัว -->
    <div id="profile-card">
        <h1>อนัญญา มั่นจินดา</h1>
        <h2>นักศึกษาปี 4 | เอกเกมและแอนิเมชัน</h2>
        <p>มหาวิทยาลัยเทคโนโลยีราชมงคลรัตนโกสินทร์</p>
    </div>

    <!-- คำแนะนำการเล่น -->
    <div id="instruction">🖱️ คลิกหมุนมุมกล้องได้อิสระ / คลิกที่ปุ่มบนตู้เกมเพื่อเปิดเมนู</div>

    <!-- Modal ป๊อบอัพแสดงรายละเอียด -->
    <div id="modal" class="modal">
        <div class="modal-header">
            <div id="modal-title" class="modal-title">หัวข้อ</div>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div id="modal-content" class="modal-content">
            รายละเอียด...
        </div>
    </div>

    <script>
        // --- 1. Scene, Camera, Renderer Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf1e7fe);
        scene.fog = new THREE.FogExp2(0xf1e7fe, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 2. Orbit Controls (ปรับมุมกล้อง) ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // ไม่ให้มุมกล้องมุดใต้พื้น
        controls.minDistance = 5;
        controls.maxDistance = 20;
        controls.target.set(0, 2.5, 0);

        // --- 3. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(8, 15, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 25;
        const d = 8;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // ไฟซอฟต์ไลท์สีชมพูส่องตู้เกม
        const pointLight = new THREE.PointLight(0xff758c, 1, 10);
        pointLight.position.set(0, 3, 3);
        scene.add(pointLight);

        // --- 4. Checkerboard Floor (พื้นลายตารางหมากรุก) ---
        function createCheckerboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const context = canvas.getContext('2d');
            const size = 64;
            
            for (let x = 0; x < canvas.width; x += size) {
                for (let y = 0; y < canvas.height; y += size) {
                    context.fillStyle = ((x / size + y / size) % 2 === 0) ? '#ffffff' : '#b8c6db';
                    context.fillRect(x, y, size, size);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(10, 10);
            return texture;
        }

        const floorGeo = new THREE.PlaneGeometry(40, 40);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: createCheckerboardTexture(),
            roughness: 0.4
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 5. Cute Low-Poly Trees (สร้างต้นไม้ประดับ) ---
        function createTree(x, z) {
            const treeGroup = new THREE.Group();

            // ลำต้น
            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1.2, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.6;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            // ใบไม้ทรงพุ่มการ์ตูน
            const leavesGeo = new THREE.DodecahedronGeometry(0.9, 1);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x7bed9f, roughness: 0.6, flatShading: true });
            
            const leaves1 = new THREE.Mesh(leavesGeo, leavesMat);
            leaves1.position.y = 1.6;
            leaves1.castShadow = true;
            treeGroup.add(leaves1);

            const leaves2 = new THREE.Mesh(leavesGeo, leavesMat);
            leaves2.position.set(0, 2.2, 0);
            leaves2.scale.set(0.7, 0.7, 0.7);
            leaves2.castShadow = true;
            treeGroup.add(leaves2);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        // วางต้นไม้รอบๆ
        const treePositions = [
            [-5, -4], [5, -4], [-6, 1], [6, 1], [-4, 5], [4, 5],
            [-8, -2], [8, -2], [-7, 4], [7, 4]
        ];
        treePositions.forEach(pos => createTree(pos[0], pos[1]));

        // --- 6. Helper Canvas สำหรับสร้าง texture สติ๊กเกอร์การ์ตูน ---
        function createStickerTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 256, 256);

            if (type === 'star') {
                ctx.fillStyle = '#fffa65';
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(128 + Math.cos((18 + i * 72) * Math.PI / 180) * 100, 128 - Math.sin((18 + i * 72) * Math.PI / 180) * 100);
                    ctx.lineTo(128 + Math.cos((54 + i * 72) * Math.PI / 180) * 40, 128 - Math.sin((54 + i * 72) * Math.PI / 180) * 40);
                }
                ctx.closePath();
                ctx.fill();
                ctx.lineWidth = 10;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            } else if (type === 'heart') {
                ctx.fillStyle = '#ff4d4d';
                ctx.beginPath();
                ctx.arc(88, 88, 50, Math.PI, 0, false);
                ctx.arc(168, 88, 50, Math.PI, 0, false);
                ctx.lineTo(128, 218);
                ctx.closePath();
                ctx.fill();
                ctx.lineWidth = 10;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            } else if (type === 'cat') {
                // หน้าแมวการ์ตูน
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(128, 140, 70, 0, Math.PI * 2);
                ctx.fill();
                // หู
                ctx.beginPath();
                ctx.moveTo(68, 100); ctx.lineTo(48, 30); ctx.lineTo(108, 80); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(188, 100); ctx.lineTo(208, 30); ctx.lineTo(148, 80); ctx.fill();
                // ตา & จมูก
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(100, 130, 8, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(156, 130, 8, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ff758c';
                ctx.beginPath(); ctx.arc(128, 145, 6, 0, Math.PI * 2); ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // --- 7. Arcade Cabinet (ตู้เกม) ---
        const arcadeGroup = new THREE.Group();
        const interactiveButtons = []; // สำหรับเก็บปุ่มที่กดได้

        // วัสดุหลักตู้เกม (สีชมพูพาสเทลสดใส)
        const cabinetMat = new THREE.MeshStandardMaterial({ color: 0xff758c, roughness: 0.3 });
        const cabinetAccentMat = new THREE.MeshStandardMaterial({ color: 0xfffa65, roughness: 0.3 });
        const screenFrameMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

        // Body ด้านล่าง
        const baseGeo = new THREE.BoxGeometry(2.2, 2.2, 2);
        const base = new THREE.Mesh(baseGeo, cabinetMat);
        base.position.y = 1.1;
        base.castShadow = true;
        base.receiveShadow = true;
        arcadeGroup.add(base);

        // Body ท่อนบน (เฉียงยื่นออกมา)
        const topGeo = new THREE.BoxGeometry(2.2, 2.6, 2.2);
        const topPart = new THREE.Mesh(topGeo, cabinetMat);
        topPart.position.set(0, 3.2, -0.1);
        topPart.castShadow = true;
        arcadeGroup.add(topPart);

        // กรอบหน้าจอ
        const screenFrameGeo = new THREE.BoxGeometry(1.8, 1.4, 0.1);
        const screenFrame = new THREE.Mesh(screenFrameGeo, screenFrameMat);
        screenFrame.position.set(0, 3.3, 0.96);
        arcadeGroup.add(screenFrame);

        // หน้าจอ (Screen Canvas)
        function createScreenTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 384;
            const ctx = canvas.getContext('2d');
            
            // Background Gradient หน้าจอ
            const grad = ctx.createLinearGradient(0,0,0,384);
            grad.addColorStop(0, '#2b1055');
            grad.addColorStop(1, '#7597de');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 384);

            // ข้อความบนหน้าจอ
            ctx.fillStyle = '#ffeaa7';
            ctx.font = 'Bold 36px Kanit';
            ctx.textAlign = 'center';
            ctx.fillText('ANANYA PORTFOLIO', 256, 80);

            ctx.fillStyle = '#ffffff';
            ctx.font = '22px Kanit';
            ctx.fillText('SELECT A BUTTON TO START', 256, 140);
            
            ctx.font = '18px Kanit';
            ctx.fillStyle = '#00cec9';
            ctx.fillText('🎮 Game & Animation Student', 256, 220);
            ctx.fillText('✨ RMUTR University', 256, 260);

            return new THREE.CanvasTexture(canvas);
        }

        const screenGeo = new THREE.PlaneGeometry(1.7, 1.3);
        const screenMat = new THREE.MeshBasicMaterial({ map: createScreenTexture() });
        const screen = new THREE.Mesh(screenGeo, screenMat);
        screen.position.set(0, 3.3, 1.02);
        arcadeGroup.add(screen);

        // ป้าย Marquee ด้านบนสุด
        const marqueeGeo = new THREE.BoxGeometry(2.0, 0.5, 0.3);
        const marqueeMat = new THREE.MeshStandardMaterial({ color: 0xfffa65, emissive: 0xfffa65, emissiveIntensity: 0.2 });
        const marquee = new THREE.Mesh(marqueeGeo, marqueeMat);
        marquee.position.set(0, 4.6, 0.9);
        arcadeGroup.add(marquee);

        // แผงคอนโทรล (Control Deck)
        const deckGeo = new THREE.BoxGeometry(2.2, 0.2, 1.0);
        const deckMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const deck = new THREE.Mesh(deckGeo, deckMat);
        deck.position.set(0, 2.1, 1.0);
        deck.rotation.x = 0.2; // เอียงเข้าหาผู้เล่น
        arcadeGroup.add(deck);

        // จอยสติ๊ก (Joystick)
        const stickBaseGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.05, 16);
        const stickBase = new THREE.Mesh(stickBaseGeo, screenFrameMat);
        stickBase.position.set(-0.6, 2.23, 1.0);
        arcadeGroup.add(stickBase);

        const stickGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.3, 8);
        const stick = new THREE.Mesh(stickGeo, screenFrameMat);
        stick.position.set(-0.6, 2.38, 1.0);
        arcadeGroup.add(stick);

        const ballGeo = new THREE.SphereGeometry(0.1, 16, 16);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xff3366 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(-0.6, 2.53, 1.0);
        arcadeGroup.add(ball);

        // --- 8. Create Interactive Buttons (สร้างปุ่มกด 4 ปุ่มสำหรับเปิดเมนู) ---
        const buttonData = [
            { 
                name: 'About Me', 
                color: 0xff4757, 
                x: -0.1, z: 0.9, 
                title: '👤 เกี่ยวกับฉัน (About Me)',
                content: `<b>ชื่อ-สกุล:</b> นางสาวอนัญญา มั่นจินดา<br>
                          <b>การศึกษา:</b> นักศึกษาปี 4 สาขาเกมและแอนิเมชัน<br>
                          <b>สถาบัน:</b> มหาวิทยาลัยเทคโนโลยีราชมงคลรัตนโกสินทร์<br>
                          <b>ความสนใจ:</b> 3D Modeling, Game Development, Character Design, Interactive Media`
            },
            { 
                name: 'Skills', 
                color: 0x2ed573, 
                x: 0.2, z: 0.9, 
                title: '🛠️ ทักษะ (Skills)',
                content: `<b>Software & Tools:</b><br>
                          - Maya / Blender (3D Modeling & Rigging)<br>
                          - Unity / Unreal Engine (Game Logic)<br>
                          - Photoshop / Illustrator / Substance Painter<br>
                          - Three.js / WebGL Basics<br><br>
                          <b>Languages:</b> C#, HTML/CSS/JS`
            },
            { 
                name: 'Projects', 
                color: 0x1e90ff, 
                x: 0.5, z: 0.9, 
                title: '🎮 ผลงาน (Projects)',
                content: `<b>1. Senior Project - 3D Action-Adventure Game</b><br>
                          - ทำหน้าที่: Lead 3D Artist & Game Designer<br><br>
                          <b>2. VR Interactive Environment</b><br>
                          - จำลองสภาพแวดล้อมเสมือนจริงด้วย Unity VR<br><br>
                          <b>3. Short Animated Film</b><br>
                          - ออกแบบตัวละคร 3D Animation ปล่อยใน YouTube`
            },
            { 
                name: 'Contact', 
                color: 0xffa502, 
                x: 0.8, z: 0.9, 
                title: '📫 ติดต่อ (Contact)',
                content: `<b>Email:</b> ananya.m@example.com<br>
                          <b>Tel:</b> 08X-XXX-XXXX<br>
                          <b>LinkedIn:</b> linkedin.com/in/ananya-m<br>
                          <b>ArtStation:</b> artstation.com/ananya_m`
            }
        ];

        buttonData.forEach(data => {
            const btnGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.08, 16);
            const btnMat = new THREE.MeshStandardMaterial({ 
                color: data.color, 
                roughness: 0.2,
                emissive: data.color,
                emissiveIntensity: 0.2 
            });
            const btnMesh = new THREE.Mesh(btnGeo, btnMat);
            
            // คำนวณตำแหน่งให้วางอยู่บน Deck ที่เอียงอยู่พอดี
            btnMesh.position.set(data.x, 2.22, data.z);
            btnMesh.rotation.x = 0.2;
            
            // บันทึกข้อมูลเมนูไว้ในuserData
            btnMesh.userData = data;
            
            arcadeGroup.add(btnMesh);
            interactiveButtons.push(btnMesh);
        });

        // --- 9. Decorating with Cartoon Stickers (สติ๊กเกอร์แปะข้างตู้) ---
        function addSticker(type, size, x, y, z, rotY) {
            const stickerGeo = new THREE.PlaneGeometry(size, size);
            const stickerMat = new THREE.MeshBasicMaterial({ 
                map: createStickerTexture(type), 
                transparent: true,
                depthWrite: false
            });
            const sticker = new THREE.Mesh(stickerGeo, stickerMat);
            sticker.position.set(x, y, z);
            sticker.rotation.y = rotY;
            arcadeGroup.add(sticker);
        }

        // แปะสติ๊กเกอร์ด้านข้างตู้เกม
        addSticker('star', 0.6, -1.11, 3.5, 0, -Math.PI / 2);
        addSticker('heart', 0.5, -1.11, 2.5, -0.4, -Math.PI / 2);
        addSticker('cat', 0.7, -1.11, 1.5, 0.3, -Math.PI / 2);

        addSticker('cat', 0.7, 1.11, 3.5, 0.2, Math.PI / 2);
        addSticker('star', 0.5, 1.11, 2.2, -0.3, Math.PI / 2);
        addSticker('heart', 0.6, 1.11, 1.3, 0.1, Math.PI / 2);

        scene.add(arcadeGroup);

        // --- 10. Raycasting & Interaction (คลิกเลือกปุ่ม) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            // ไม่ทำงานถ้าคลิกบน UI Modal
            if (event.target.tagName !== 'CANVAS') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveButtons);

            if (intersects.length > 0) {
                const clickedBtn = intersects[0].object;
                
                // Animation ปุ่มกดลงเล็กน้อย
                clickedBtn.position.y -= 0.03;
                setTimeout(() => clickedBtn.position.y += 0.03, 150);

                // แสดง Modal
                openModal(clickedBtn.userData.title, clickedBtn.userData.content);
            }
        });

        // Hover Effect เปลี่ยน Cursor
        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveButtons);

            document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
        });

        // Modal Functions
        function openModal(title, content) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // --- 11. Window Resize Handling ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 12. Animation Loop ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();

            // ทำให้ตู้เกมลอยนุ่มๆ เล็กน้อย ให้ดูนวัตกรรมน่ารักๆ
            arcadeGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.05;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
